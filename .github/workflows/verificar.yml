# Verificação a cada push e a cada pull request: formatação e lint dos
# scripts, conferidor dos capítulos, conferidor da pixel art e o teste de fumaça no Godot sem tela,
# as mesmas conferências descritas no CLAUDE.md. O resultado aparece na
# aba Actions do GitHub e na marca ao lado de cada commit.
name: Verificar

on:
  push:
  pull_request:

jobs:
  scripts:
    name: Formato, lint e conferidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o gdtoolkit
        run: pip install "gdtoolkit==4.5.0"
      - name: Formatação
        run: gdformat --check .
      - name: Lint
        run: gdlint .
      - name: Conferir os capítulos
        run: |
          for dados in world/tutorial/tutorial_data.gd world/chapter_*/chapter_*_data.gd; do
            echo "== $dados"
            python3 tools/check_chapter.py "$dados"
          done
      - name: Conferir a pixel art
        run: python3 tools/check_art.py

  godot:
    name: Teste de fumaça no Godot
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Rodar o teste de fumaça
        run: sh tools/run_smoke_test.sh godot

  windows:
    name: Jogo para Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Achar os modelos de exportação
        # A imagem guarda os modelos na pasta do root, e o GitHub roda com
        # outra pasta de usuário.
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ ! -e ~/.local/share/godot/export_templates/4.7.2.stable ]; then
            ln -s /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          fi
      - name: Exportar
        run: |
          mkdir -p build
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --export-release "Windows" build/giorgino.exe
          test -s build/giorgino.exe
      - name: Guardar o jogo
        uses: actions/upload-artifact@v4
        with:
          name: giorgino-windows
          path: build/giorgino.exe
